[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Build environment variables
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,NEXT_PUBLIC_PUSHER_KEY"

# Environment variables MUST be set in the Netlify UI:
#   Site settings → Environment variables → Add new
#
# Required:
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY  (Clerk Dashboard → API Keys → Publishable key)
#   CLERK_SECRET_KEY                   (Clerk Dashboard → API Keys → Secret key)
#   DATABASE_URL                       (PostgreSQL connection string)
#
# Optional (for voice messages & calls):
#   STORAGE_ENDPOINT, STORAGE_BUCKET, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY
#   TURN_SERVER_URL, TURN_USERNAME, TURN_CREDENTIAL
#
# Realtime (using Pusher - managed service, no WebSocket server needed):
#   NEXT_PUBLIC_PUSHER_KEY       (Pusher Dashboard → App Keys → Key)
#   PUSHER_APP_ID                (Pusher Dashboard → App Keys → App ID)
#   PUSHER_SECRET                (Pusher Dashboard → App Keys → Secret)
#   NEXT_PUBLIC_PUSHER_CLUSTER   (Pusher Dashboard → App Keys → Cluster, default: mt1)
#
# Legacy WebSocket (deprecated, use Pusher instead):
#   NEXT_PUBLIC_REALTIME_URL  (wss://your-websocket-server.example.com - requires separate WebSocket server deployment)