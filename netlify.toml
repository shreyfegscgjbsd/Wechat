[build]
command = "npm run build"
publish = ".next"
functions = "netlify/functions"

# All API routes are handled by Next.js built-in serverless functions
# No manual redirect needed — Netlify serves .next automatically when output is standard Next.js

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/next/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[functions]
node_bundler = "esbuild"
directory = "netlify/functions"

[build.environment]
NODE_VERSION = "20"
NEXT_RUNTIME = "nodejs"
# Clerk Authentication — REQUIRED: set these in Netlify Dashboard > Environment Variables
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
CLERK_SECRET_KEY = "${CLERK_SECRET_KEY}"
# Database
DATABASE_URL = "${DATABASE_URL}"
# Object Storage
STORAGE_ENDPOINT = "${STORAGE_ENDPOINT}"
STORAGE_BUCKET = "${STORAGE_BUCKET}"
STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY}"
STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY}"
STORAGE_USE_SSL = "${STORAGE_USE_SSL}"
# WebRTC TURN
TURN_SERVER_URL = "${TURN_SERVER_URL}"
TURN_USERNAME = "${TURN_USERNAME}"
TURN_CREDENTIAL = "${TURN_CREDENTIAL}"
# App
NEXT_PUBLIC_APP_URL = "${DEPLOY_URL}"